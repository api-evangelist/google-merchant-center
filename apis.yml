aid: google-merchant-center
name: Google Merchant Center
description: >-
  The Google Merchant API enables programmatic management of Merchant Center accounts including product data,
  inventories, promotions, reports, conversions, and order tracking. It replaces the Content API for Shopping and
  provides access to manage product feeds, local and regional inventory, and shopping campaign data.
